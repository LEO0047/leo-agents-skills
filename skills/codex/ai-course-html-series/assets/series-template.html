<script id="guideData" type="application/json">__PAGES__</script>
<script>
'use strict';
const pages=JSON.parse(document.getElementById('guideData').textContent);
const $=id=>document.getElementById(id);let pageIndex=0,itemIndex=0,viewOverride=null;
let navDepth=0;
const stateKey='chatgpt-function-guide-v2';
function resolveTarget(page,item=0){return Number(page)===27?{page:26,item:Number(item)===1?5:6}:{page:Number(page),item};}
function activeScreen(){const p=pages[pageIndex],item=p.items[itemIndex],id=viewOverride??item.screen??p.id;return id===p.id?p:p.views[String(id)];}
function boxOnScreen(page,item,screen){return (item.screen||page.id)===screen.id?item.box:item.interaction?.viewRects?.[String(screen.id)]||null;}
function currentState(){return {guide:stateKey,page:pages[pageIndex].id,item:itemIndex,view:viewOverride,depth:navDepth,scroll:window.scrollY||0};}
function saveState(){history.replaceState(currentState(),'',`#s${pages[pageIndex].id}-b${itemIndex+1}`);}
function parseHash(){const m=location.hash.match(/^#s(\d+)(?:-b(\d+))?$/);return resolveTarget(m?Number(m[1]):pages[0].id,m?Math.max(0,Number(m[2]||1)-1):0);}
function syncBack(){ $('back').disabled=navDepth===0; }
const groups=[...new Set(pages.map(p=>p.group))];
for(const group of groups){
 const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent=group;details.append(summary);
 const optgroup=document.createElement('optgroup');optgroup.label=group;let section='';
 for(const p of pages.filter(p=>p.group===group&&(p.navEntry??p.id)===p.id)){
  if(p.navSection&&p.navSection!==section){const heading=document.createElement('div');heading.className='navSection';heading.textContent=p.navSection;details.append(heading);section=p.navSection;}
  const b=document.createElement('button');b.type='button';b.className='pageLink';b.textContent=p.title;b.dataset.id=String(p.id);b.addEventListener('click',()=>showPage(p.id));details.append(b);
  const opt=document.createElement('option');opt.value=String(p.id);opt.textContent=p.title;optgroup.append(opt);
 }
 $('sideNav').append(details);$('screenSelect').append(optgroup);
}
function showPage(id,updateHash=true,selected=0,view=null){clearMotion();const target=resolveTarget(id,selected);id=target.page;selected=target.item;if(updateHash){saveState();navDepth++;}let idx=pages.findIndex(p=>p.id===Number(id));if(idx<0)idx=0;pageIndex=idx;itemIndex=0;const p=pages[idx];$('screenTitle').textContent=p.title;$('group').textContent=p.group;$('count').textContent=`${idx+1} / ${pages.length}`;$('screenSelect').value=String(p.navEntry??p.id);$('prev').disabled=idx===0;$('next').disabled=idx===pages.length-1;$('screenImage').alt=`${p.title}：iPhone 實際畫面`;$('screenImage').src=p.image;$('note').textContent=p.note;
 for(const link of document.querySelectorAll('.pageLink')){link.parentElement.open=pages.find(q=>q.id===Number(link.dataset.id)).group===p.group;if(Number(link.dataset.id)===(p.navEntry??p.id)){link.setAttribute('aria-current',Number(link.dataset.id)===p.id?'page':'location')}else link.removeAttribute('aria-current')}
 $('choices').replaceChildren();p.items.forEach((item,i)=>{const b=document.createElement('button');b.className='choice';b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>showItem(i));const n=document.createElement('span');n.className='n';n.textContent=String(i+1);b.append(n,document.createTextNode(item.label));$('choices').append(b)});
 if(updateHash)history.pushState({guide:stateKey,page:p.id,item:0,depth:navDepth,scroll:0},'',`#s${p.id}`);showItem(Math.min(Math.max(0,selected),p.items.length-1),false,view);syncBack();if(updateHash){$('screenTitle').scrollIntoView({block:'start'});$('screenTitle').focus({preventScroll:true});saveState();}

function showItem(i,remember=true,view=null){clearToast();const p=pages[pageIndex];itemIndex=i;const item=p.items[i];viewOverride=view!==null&&(Number(view)===p.id||p.views?.[String(view)])&&item.interaction?.viewRects?.[String(view)]?Number(view):null;renderScreen();$('itemNumber').textContent=`按鈕 ${i+1} / ${p.items.length}`;$('itemTitle').textContent=item.label;$('itemText').textContent=item.text;$('interactionNote').textContent=item.interaction_note||'';$('jump').hidden=!item.go;$('jump').textContent=item.jump_label||'看展開後的畫面 →';$('jump').onclick=item.go?()=>showPage(item.go):null;$('sources').replaceChildren();const refs=item.sources||[];if(item.basis!=='依 OpenAI 官方說明整理'||!refs.length){const basis=document.createElement('span');basis.textContent=item.basis||'實拍介面操作';$('sources').append(basis);}for(const [index,source] of refs.entries()){const a=document.createElement('a');a.href=source.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='OpenAI 官方說明'+(refs.length>1?' '+(index+1):'');a.title=source.title;a.setAttribute('aria-label','OpenAI 官方說明：'+source.title);$('sources').append(a)}if(remember)saveState();[...$('choices').children].forEach((b,n)=>b.setAttribute('aria-pressed',String(n===i)));requestAnimationFrame(()=>{draw();animateElement($('ring'),[{strokeOpacity:.45},{strokeOpacity:1},{strokeOpacity:.8}],{duration:1200,easing:'ease-in-out',iterations:1});})}
// Use the shortest clear direct/right-angle connector across blank UI space.
// Its endpoint slides along the callout border, avoiding an extra step at the end.
function routeLeader(box, obstacles, photo, end, clearance=3) {
 const [x,y,w,h]=box, cx=x+w/2, cy=y+h/2;
 const [endX,minY,maxY]=end, gap=Math.max(3,clearance*2);
 const hits=(a,b,r)=>{
  const [rx,ry,rw,rh]=r;
  if(Math.abs(a[0]-b[0])<.001)return a[0]>rx-clearance&&a[0]<rx+rw+clearance&&Math.max(a[1],b[1])>ry-clearance&&Math.min(a[1],b[1])<ry+rh+clearance;
  return a[1]>ry-clearance&&a[1]<ry+rh+clearance&&Math.max(a[0],b[0])>rx-clearance&&Math.min(a[0],b[0])<rx+rw+clearance;
 };
 const candidates=[];
 function add(side,points){
  const finish=points[points.length-1];
  if(finish[1]<minY||finish[1]>maxY){
   // The card stays at the top; turn only in the clear gap outside the phone.
   const gutter=photo.x+photo.w+(endX-photo.x-photo.w)/2;
   if(gutter<=photo.x+photo.w||gutter>=endX)return;
   const targetY=Math.max(minY,Math.min(maxY,finish[1]));
   points=[...points.slice(0,-1),[gutter,finish[1]],[gutter,targetY],[endX,targetY]];
  }
  if(points.slice(1).some((p,i)=>obstacles.some(r=>hits(points[i],p,r))))return;
  const score=points.slice(1).reduce((sum,p,i)=>sum+Math.abs(p[0]-points[i][0])+Math.abs(p[1]-points[i][1]),0);
  candidates.push({side,points,score});
 }
 add('right',[[x+w,cy],[endX,cy]]);
 // Prefer a lower exit when upper/lower routes are equally short.
 add('bottom',[[cx,y+h],[cx,y+h+gap],[endX,y+h+gap]]);
 add('top',[[cx,y],[cx,y-gap],[endX,y-gap]]);
 // If an adjacent symbol is taller, clear its edge with the same single elbow.
 for(const [ox,oy,ow,oh] of obstacles){
  if(ox+ow<=cx||ox>=endX)continue;
  const below=oy+oh+gap, above=oy-gap;
  if(below>y+h&&below<=photo.y+photo.h)add('bottom',[[cx,y+h],[cx,below],[endX,below]]);
  if(above<y&&above>=photo.y)add('top',[[cx,y],[cx,above],[endX,above]]);
 }
 candidates.sort((a,b)=>a.score-b.score);
 // Keep the ring alone if a future screenshot has no clear short connector.
 return candidates[0]||null;
}
// Expand the visible ring only; preserve the original hit area and its center.
function paddedRingBox(box,obstacles,bounds){
 const [x,y,w,h]=box;
 let pad=Math.min(3,x-bounds.x-2,y-bounds.y-2,bounds.x+bounds.w-x-w-2,bounds.y+bounds.h-y-h-2);
 for(const [ox,oy,ow,oh] of obstacles){
  const gap=Math.max(ox-x-w,x-ox-ow,oy-y-h,y-oy-oh);
  pad=Math.min(pad,gap-2);
 }
 pad=Math.max(0,pad);
 return [x-pad,y-pad,w+pad*2,h+pad*2];
}
function draw(){
 const scene=$('scene'),phone=$('phone'),card=$('callout');if(!phone.clientWidth)return;
 const page=pages[pageIndex],screen=activeScreen(), [x,y,w,h]=boxOnScreen(page,page.items[itemIndex],screen);
 const stageRect=scene.getBoundingClientRect(),viewportRect=$('phoneViewport').getBoundingClientRect();
 const sourceRect=phone.getBoundingClientRect(),scale=sourceRect.width/screen.width;
 const stacked=window.matchMedia('(max-width:620px)').matches;
 card.style.marginTop=stacked?'0px':Math.max(0,viewportRect.top-stageRect.top)+'px';
 const sr=scene.getBoundingClientRect(),pr=phone.getBoundingClientRect(),cr=card.getBoundingClientRect();
 const photo={x:pr.left-sr.left,y:pr.top-sr.top,w:pr.width,h:pr.height};
 const transform=([bx,by,bw,bh])=>[photo.x+bx*scale,photo.y+by*scale,bw*scale,bh*scale];
 const obstacles=page.items.filter((item,i)=>i!==itemIndex).map(item=>boxOnScreen(page,item,screen)).filter(Boolean).map(transform);
 obstacles.push(...(screen.obstacles||[]).map(obstacle=>transform(obstacle.box)));
 obstacles.push(transform([0,38,screen.width,48])); // time, camera island, signal and battery
 const bounds={x:viewportRect.left-sr.left+3,y:viewportRect.top-sr.top+3,w:viewportRect.width-6,h:viewportRect.height-6};
 const box=paddedRingBox(transform([x,y,w,h]),obstacles,bounds), [xx,yy,ww,hh]=box;
 $('connectors').setAttribute('viewBox',`0 0 ${sr.width} ${sr.height}`);
 for(const [k,v] of Object.entries({x:xx,y:yy,width:ww,height:hh,rx:page.items[itemIndex].shape==='circle'||Math.abs(ww-hh)<.01?Math.min(ww,hh)/2:Math.min(12,hh/3)}))$('ring').setAttribute(k,String(v));
 if(stacked){$('leader').setAttribute('d','');$('dot').style.display='none';return;}

 const end=[cr.left-sr.left,cr.top-sr.top+8,cr.bottom-sr.top-8];
 const route=routeLeader(box,obstacles,photo,end,3*scale);
 $('leader').setAttribute('d',route?route.points.map((p,i)=>`${i?'L':'M'} ${p[0]} ${p[1]}`).join(' '):'');

}
const demoState=new Map();
let targetsVisible=false;
let motionBusy=false;
let motionTimer=null;
let motionLayers=[];
let toastTimer=null;
function animateElement(el,frames,options){
 if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||!el.animate)return null;

}
function clearToast(){clearTimeout(toastTimer);$('actionTag').classList.remove('is-visible');$('actionTag').textContent='';}
function announceAction(label){
 clearToast();if(!label)return;
 $('actionTag').textContent=label;$('actionTag').classList.add('is-visible');

}
function displayMasks(screen){return [[0,0,screen.width,38,'#fff'],...screen.masks,...(screen.presentationMasks||[])];}
function demoKey(page,item){return page.id+':'+(item.interaction.group||item.label);}
function demoValue(page,item){const key=demoKey(page,item);return demoState.has(key)?demoState.get(key):item.interaction.initial;}
function renderDemoState(button,page,item,box=item.box,rect=item.interaction?.rect){
 const action=item.interaction;
 if(!action||!['toggle','radio'].includes(action.type))return;
 const [x,y,w,h]=rect,[bx,by,bw,bh]=box;
 const selected=action.type==='toggle'?demoValue(page,item):demoValue(page,item)===action.value;

}
function renderHotspots(){
 const page=pages[pageIndex],screen=activeScreen();
 const host=$('hotspots');host.replaceChildren();
 page.items.forEach((item,i)=>{
  const alternate=item.interaction?.viewRects?.[String(screen.id)];
  if((item.screen||page.id)!==screen.id&&!alternate)return;
  const box=boxOnScreen(page,item,screen);
  const [x,y,w,h]=box,b=document.createElement('button');
  b.type='button';b.className='hotspot';b.dataset.index=String(i);b.dataset.selected=String(i===itemIndex);b.style.borderRadius=item.shape==='circle'||w===h?'50%':'min(12px, 33%)';

 $('phone').classList.toggle('show-targets',targetsVisible);
 const pager=$('phonePager');pager.replaceChildren();
 const continuation=page.continuation||{};

  const b=document.createElement('button');b.textContent=label;b.addEventListener('click',()=>navigatePhone(continuation[direction],direction));pager.append(b);

  const ids=[page.id,...Object.keys(page.views).map(Number)];

   b.addEventListener('click',()=>{const prev=activeScreen();showItem(page.items.findIndex(item=>(item.screen||page.id)===id));animateScreen(prev);});pager.append(b);
  }

}
function restoreControlFocus(i){const b=[...$('hotspots').children].find(button=>Number(button.dataset.index)===i);b?.focus({preventScroll:true});}
function activateItem(i){
 if(motionBusy)return;
 const keyboardFocus=document.activeElement?.className==='hotspot';
 const page=pages[pageIndex],item=page.items[i],visibleId=activeScreen().id;
 showItem(i,true,item.interaction?.viewRects?.[String(visibleId)]?visibleId:null);
 const action=item.interaction;

  const key=demoKey(page,item);
  demoState.set(key,action.type==='toggle'?!demoValue(page,item):action.value);
  renderHotspots();
  announceAction(action.type==='toggle'?(demoValue(page,item)?'已開啟':'已關閉'):'已選擇：'+item.label);
  if(keyboardFocus)restoreControlFocus(i);
  return;
 }

  if(navDepth>0){history.back();return;}
  navigatePhone(action.fallback,'back');return;
 }

function screenLayer(screen){
 const layer=document.createElement('div');layer.className='screenMotion';layer.setAttribute('aria-hidden','true');

  const mask=document.createElement('span');mask.className='mask';
  Object.assign(mask.style,{left:x/screen.width*100+'%',top:y/screen.height*100+'%',width:w/screen.width*100+'%',height:h/screen.height*100+'%',background:color});layer.append(mask);
 }

}
function clearMotion(){clearTimeout(motionTimer);motionLayers.forEach(layer=>layer.remove());motionLayers=[];motionBusy=false;}
function animateScreen(previous){
 if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||!$('phone').animate)return;

 if(previous.id===next.id)return;

 if(panel){
  const [x,y,w,h]=panel.rect;incoming=screenLayer(next);
  incoming.style.clipPath=`inset(${y/next.height*100}% ${(next.width-x-w)/next.width*100}% ${(next.height-y-h)/next.height*100}% ${x/next.width*100}%)`;
  $('phone').append(incoming);motionLayers.push(incoming);
  animateElement(incoming,[{opacity:0,transform:panel.enter==='left'?'translateX(-28px)':'translateY(22px)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.7,.2,1)'});
 }
 animateElement(outgoing,[{opacity:1},{opacity:0}],{duration:panel?220:180,easing:'ease-out',fill:'forwards'});

function navigatePhone(id,direction='forward',label=''){
 if(motionBusy)return;

}
$('showTargets').addEventListener('click',()=>{targetsVisible=!targetsVisible;$('showTargets').setAttribute('aria-pressed',String(targetsVisible));$('phone').classList.toggle('show-targets',targetsVisible);});
$('restart').addEventListener('click',()=>navigatePhone(1));
let touchStart=null;
$('phone').addEventListener('touchstart',event=>{touchStart=event.touches.length===1?{x:event.touches[0].clientX,y:event.touches[0].clientY}:null;},{passive:true});

},{passive:true});

$('screenSelect').addEventListener('change',e=>showPage(e.target.value));$('prev').addEventListener('click',()=>{if(pageIndex>0)showPage(pages[pageIndex-1].id)});$('next').addEventListener('click',()=>{if(pageIndex<pages.length-1)showPage(pages[pageIndex+1].id)});$('screenImage').addEventListener('load',()=>requestAnimationFrame(draw));window.addEventListener('resize',()=>requestAnimationFrame(draw));window.addEventListener('popstate',()=>{const previous=activeScreen();const st=history.state;if(st&&st.guide===stateKey){navDepth=st.depth;showPage(st.page,false,st.item,st.view);animateScreen(previous);requestAnimationFrame(()=>{window.scrollTo(0,st.scroll||0);const selected=[...$('hotspots').children].find(b=>Number(b.dataset.index)===st.item);selected?.focus({preventScroll:true});});}else{navDepth=0;const target=parseHash();showPage(target.page,false,target.item);saveState();}});window.addEventListener('hashchange',()=>{const target=parseHash();if(target.page!==pages[pageIndex].id||target.item!==itemIndex){navDepth=0;showPage(target.page,false,target.item);saveState();}});new ResizeObserver(()=>requestAnimationFrame(draw)).observe($('phone'));
$('back').addEventListener('click',()=>{if(navDepth>0)history.back();});window.addEventListener('scroll',()=>{const st=history.state;if(st&&st.guide===stateKey)history.replaceState({...st,scroll:window.scrollY||0},'');},{passive:true});
const initial=history.state&&history.state.guide===stateKey?history.state:parseHash();navDepth=initial.depth||0;showPage(initial.page,false,initial.item,initial.view);saveState();
