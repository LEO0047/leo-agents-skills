name: Bounded TWSE endpoint probe

on:
  push:
    branches:
      - tmp/twse-probe-20260814
    paths:
      - tmp_twse_probe_fast.py
      - .github/workflows/tmp-twse-probe-fast.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Run bounded probes and fetch JSON metadata
        run: python tmp_twse_probe_fast.py
      - name: List generated files
        if: always()
        run: find twse_probe_output_fast -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
      - name: Upload bounded probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twse-probe-results-fast
          path: twse_probe_output_fast/
          if-no-files-found: error
          retention-days: 1
