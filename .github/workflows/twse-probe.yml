name: Temporary TWSE endpoint probe

on:
  push:
    branches:
      - tmp/twse-probe-20260814
    paths:
      - .github/workflows/twse-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe endpoints and collect JSON
        env:
          PYTHONUNBUFFERED: "1"
        run: python .github/scripts/twse_probe.py

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twse-probe-results
          path: out/
          if-no-files-found: error
          retention-days: 1
